---
profile: jdcloud_er2
target: ipq53xx
subtarget: generic
description: Build image for the JDCloud ER2
image: bin/targets/ipq53xx/generic/openwrt-ipq53xx-jdcloud_er2-squashfs-sysupgrade.bin
feeds:
  - name: qca
    path: ../../feeds/qca-wifi-7
  # bandix：流量看板（前端 luci-app-bandix + 后端 Rust eBPF 程序 bandix）。
  # 后端需要 BTF 吗？实测不需要：内核没开 CONFIG_DEBUG_INFO_BTF，tcx 后端
  # 依然能加载（0.12.12 验证过）。
  - name: bandix
    uri: https://github.com/timsaya/luci-app-bandix.git
    branch: main
  - name: bandixcore
    uri: https://github.com/timsaya/openwrt-bandix.git
    branch: main

  # 以下是应用层需要的第三方 feed。defconfig 里一直有 CONFIG_FEED_<name>=y，
  # 但 profile 没声明，干净构建会静默丢包（2026-11-06 对齐设备实装时补上）。
  - name: openclash
    uri: https://github.com/vernesong/OpenClash.git
    branch: master
  - name: viking
    uri: https://github.com/VIKINGYFY/packages.git
    branch: main
  - name: lucky
    uri: https://github.com/gdy666/luci-app-lucky.git
    branch: main
  - name: partexp
    uri: https://github.com/sirpdboy/luci-app-partexp.git
    branch: main
  - name: qbt
    uri: https://github.com/sbwml/luci-app-qbittorrent.git
    branch: master
    
include:
  - webui
# Base system and kernel packages only.  User space extras (applications,
# themes, translations, ...) are deliberately kept out of this file: they are
# added through the local .config of the build, so the profile only has to
# describe what the board itself needs to bring its firmware up.
packages:
  # --- board / platform ------------------------------------------------
  - ipq53xx
  - qca-ssdk-shell
  # --- NSS / PPE / SSDK driver stack (kernel) --------------------------
  - kmod-qca-nss-dp-qca
  - kmod-qca-nss-phy
  - kmod-qca-mdio
  - kmod-qca-ssdk-qca-nohnat
  - kmod-qca-nss-ppe
  - kmod-qca-nss-ppe-bridge-mgr
  - kmod-qca-nss-ppe-vlan-mgr
  - kmod-qca-nss-ppe-netlink
  - kmod-qca-nss-ppe-pppoe-mgr
  - kmod-qca-nss-ppe-ds
  - kmod-qca-nss-ppe-rule
  - kmod-qca-nss-ppe-vp
  # SFE is the fast-path engine, ECM is the connection manager that actually
  # programs the flows into it (SFE alone never creates a single connection:
  # "sfe_dump" stays at create_requests=0 / num_connections=0 and everything is
  # software forwarded).  kmod-qca-nss-ecm-standard depends on
  # kmod-qca-nss-sfe + kmod-qca-nss-ppe and pulls in the /etc/init.d/qca-nss-ecm
  # glue (loads ecm with the sfe/ppe front end and un-stops the front ends).
  - kmod-qca-nss-sfe
  - kmod-qca-nss-ecm-standard
  - kmod-phylink
  - kmod-phy-aquantia
  # --- storage / filesystem / boot (base system) ------------------------
  # main 是最全最稳的一条线：分区、块设备、加密这几批都保留，
  # zt 的精简（44a90e66）没有带到 main 上来。
  - block-mount
  - blockd
  - uboot-envtools
  - e2fsprogs
  - resize2fs
  - blkid
  - lsblk
  - cfdisk
  - fdisk
  - sgdisk
  - parted
  - losetup
  - kmod-loop
  - kmod-nvme
  - kmod-fs-ext4
  - kmod-fs-squashfs
  - kmod-fs-autofs4
  # --- base networking --------------------------------------------------
  - tc-tiny
  - resolveip
  # --- kernel: netfilter / tunnels / GPIO / NLS -------------------------
  - kmod-nf-flow
  - kmod-ifb
  - kmod-inet-diag
  - kmod-tun
  - kmod-wireguard
  - kmod-tcp-bbr
  - kmod-sched-core
  - kmod-gpio-button-hotplug
  - kmod-leds-gpio
  # --- kernel: pstore/ramoops (panic log) -------------------------------
  # The board DTS reserves ramoops@49c00000 (see ipq5332-jdcloud-er2.dts), so
  # the pstore backend and the ramoops driver belong into the base image.
  - kmod-pstore
  - kmod-ramoops
  - kmod-nls-base
  - kmod-nls-cp437
  - kmod-nls-iso8859-1
  - kmod-nls-utf8
  # --- kernel: crypto (wireguard / IPsec / dm-crypt) --------------------
  - kmod-crypto-acompress
  - kmod-crypto-ccm
  - kmod-crypto-cmac
  - kmod-crypto-crc32c
  - kmod-crypto-ctr
  - kmod-crypto-gcm
  - kmod-crypto-gf128
  - kmod-crypto-ghash
  - kmod-crypto-hmac
  - kmod-crypto-md4
  - kmod-crypto-md5
  - kmod-crypto-rng
  - kmod-crypto-seqiv
  - kmod-crypto-sha256
  - kmod-crypto-sha512

  # --- 用户界面：aurora 主题 + 中文（本地 extras feed）----------------
  - luci-mod-admin-full
  - luci-theme-aurora
  - luci-app-aurora-config
  - luci-i18n-aurora-config-zh-cn
  - luci-i18n-base-zh-cn
  - luci-i18n-firewall-zh-cn

#include:
#  - ucentral-ap
diffconfig: |
  # 中文界面：luci 的 luci-i18n-*-zh-cn 翻译包只有在打开对应语言后才会出现在
  # kconfig 里，否则上面 packages 里列的 zh-cn 条目会被 make defconfig 静默丢弃。
  CONFIG_LUCI_LANG_zh_Hans=y

  CONFIG_KERNEL_IPQ_MEM_PROFILE=0
  CONFIG_ARCH_QCOM=y
  # SAWF/telemetry steering is not used on this board; the qca feed enables it
  # by default (CONFIG_PACKAGE_ATH12K_SAWF defaults to y).
  # CONFIG_PACKAGE_ATH12K_SAWF is not set
  # PPE Qdisc (hardware rate-limit) disabled on purpose: with it enabled the
  # ECM PPE front end rejects hardware acceleration for any flow whose
  # interface carries a Linux qdisc (see v4_exception_ported_from_iface_
  # qdisc_unsupported), which is the case for the NSS-DP ports as they come up
  # with the default fq_codel.  Without it PPE acceleration works out of the box.
  # CONFIG_PACKAGE_kmod-qca-nss-ppe-qdisc is not set
  # PPE flow deacceleration/flush on exception is disabled for this board from
  # the driver package (MODPARAMS.qca-nss-ppe in qca-nss-ppe/Makefile): the
  # peer->LAN IPv6 traffic of the P2P/VPN flows arrives fragmented, and IPV6_FRAG
  # (cpu code 31) is a DEACCEL_EN exception, so every fragment used to flush the
  # corresponding accelerated flow and ECM re-accelerated it again (1.54M
  # v6_create_req vs 1.54M v6_flush_req).  Measured with the per-CPU-code
  # exception/flush counters from /sys/kernel/debug/qca-nss-ppe/stats/cc_stats
  # (those extra counters were debug-only and are not carried in the tree any
  # more; the flow_deacclr_dis=1 module parameter is what the fix relies on).




